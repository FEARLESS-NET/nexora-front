# ==========================================
# Render deployment config — Frontend
# ==========================================
# Deploy this repo on Render as a Static Site.
# After creating the service, set the following
# environment variables in the Render dashboard:
#   VITE_API_URL    -> https://<your-backend>.onrender.com/api
#   VITE_SOCKET_URL -> https://<your-backend>.onrender.com

services:
  - type: web
    name: nexora-front
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html